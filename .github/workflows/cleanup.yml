name: Cleanup Output Files

on:
  schedule:
    # 毎週月曜 0時(UTC) に実行
    - cron: "0 0 * * 1"
  workflow_dispatch:
    # 手動実行も可能

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup output folder
        run: |
          echo "Cleaning up output folder..."

          # outputフォルダが存在しない場合はスキップ
          if [ ! -d "my-upscaler/output" ]; then
            echo "Output folder does not exist. Skipping."
            exit 0
          fi

          FILES=$(find my-upscaler/output -type f 2>/dev/null) || true

          if [ -n "$FILES" ]; then
            echo "Found files to delete:"
            ls -la my-upscaler/output/

            # すべてのファイルを削除（ディレクトリ構造は維持）
            find my-upscaler/output -type f -delete

            echo "All files in output folder have been deleted."
          else
            echo "No files to delete in output folder."
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A my-upscaler/output/ 2>/dev/null || true

          if git status --porcelain | grep -q "^[AMD]"; then
            git commit -m "Cleanup: Remove output files [skip ci]"
            git push
            echo "Cleanup completed and pushed."
          else
            echo "No changes to commit."
          fi
